<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#d9ecff"
  >

  <!-- iPhone / iPad -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="ALAGA"
  >

  <!-- App Icon -->
  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >

  <!-- Browser Tab Icon -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon-32.png"
  >

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <!-- Styles -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <title>ALAGA</title>

</head>


<body>

  <main
    id="app"
    class="app-shell"
  ></main>


  <script src="app.js"></script>


  <script>

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker.register(
        "./sw.js"
      );

    }

  </script>

</body>

</html>
